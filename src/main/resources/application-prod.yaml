# ─────────────────────────────────────────────────────────────────────────────
# Profile PROD — Docker / Cloud con autenticación AWS Cognito
#
# Configuración con validación obligatoria de JWT emitido por AWS Cognito.
# Los accesos a base de datos y broker cuentan con valores por defecto orientados
# a los servicios locales de Docker Desktop ('db' y 'rabbitmq'), pero pueden
# sobreescribirse mediante variables de entorno si fuera necesario.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  # ─── Seguridad: OAuth2 Resource Server con JWT (AWS Cognito) ───────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${COGNITO_REGION:us-east-1}.amazonaws.com/${COGNITO_USER_POOL_ID}

  # ─── Base de datos (contenedor 'db' en Docker Desktop o externa) ─────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:andesstay_notify}}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ─── Persistencia JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: false

  # ─── Broker de Mensajería: RabbitMQ (contenedor 'rabbitmq' en Docker Desktop) 
  rabbitmq:
    host: ${RABBIT_HOST:rabbitmq}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5

server:
  port: ${SERVER_PORT:8082}

# ─── AWS Cognito App Client ID (validación del claim client_id) ──────────────
cognito:
  app-client-id: ${COGNITO_APP_CLIENT_ID}

# ─── Configuración de CORS ───────────────────────────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:8081}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.andesstay.notify: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.amqp: INFO
    org.hibernate: WARN
