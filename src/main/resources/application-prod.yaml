# ─────────────────────────────────────────────────────────────────────────────
# Profile PROD — AWS EC2 / Docker / Cloud (Profile por defecto)
#
# Configuración para despliegue en la nube (AWS RDS + RabbitMQ + OAuth2 JWT).
# Todos los accesos se leen dinámicamente mediante variables de entorno para
# evitar credenciales quemadas o referencias fijas a localhost.
#
# Autenticación: AWS Cognito (access token con claim client_id).
# ─────────────────────────────────────────────────────────────────────────────
spring:
  # ─── Seguridad: OAuth2 Resource Server con JWT (AWS Cognito) ───────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${COGNITO_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

  # ─── Base de datos Cloud (AWS RDS PostgreSQL / MySQL) ─────────────────────
  # Soporta conexión directa mediante DB_URL (ej. jdbc:postgresql://rds-host:5432/dbname)
  # o mediante variables separadas (DB_HOST, DB_PORT, DB_NAME).
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  # ─── Persistencia JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      # 'update' permite que Hibernate cree/actualice las tablas (notificaciones,
      # processed_events) en una base de datos RDS nueva.
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: false

  # ─── Broker de Mensajería: RabbitMQ (AWS EC2 / Amazon MQ) ─────────────────
  rabbitmq:
    host: ${RABBIT_HOST}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER}
    password: ${RABBIT_PASS}
    virtual-host: ${RABBIT_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: false
        prefetch: 10
        concurrency: 2
        max-concurrency: 5

server:
  port: ${SERVER_PORT:8082}

# ─── AWS Cognito App Client ID (validación del claim client_id) ──────────────
cognito:
  app-client-id: ${COGNITO_APP_CLIENT_ID}

# ─── Configuración de CORS para el entorno Cloud ─────────────────────────────
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# ─── Logging en producción ───────────────────────────────────────────────────
logging:
  level:
    com.andesstay.notify: ${LOG_LEVEL:INFO}
    org.springframework.security: ${SECURITY_LOG_LEVEL:INFO}
    org.springframework.amqp: INFO
    org.hibernate: WARN
