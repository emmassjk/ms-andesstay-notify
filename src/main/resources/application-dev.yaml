# ─────────────────────────────────────────────────────────────────────────────
# Profile DEV — desarrollo local
# Se activa automáticamente cuando spring.profiles.active=dev (por defecto en local).
#
# Diferencias respecto al yaml base:
#   1. JWT deshabilitado → Spring Security permite todas las peticiones sin token.
#   2. ddl-auto: update → Hibernate crea/migra tablas automáticamente (sin Flyway).
#   3. show-sql: true   → Muestra las queries en consola para debug.
#   4. Credenciales locales hardcoded (NUNCA en producción).
# ─────────────────────────────────────────────────────────────────────────────
spring:
  # ─── Sin JWT en dev ───────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""

  # ─── BD: usa env vars (DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS).
  #     En local sin Docker: crea un .env o exporta las variables manualmente.
  #     En Docker: docker-compose.yml inyecta los valores correctos.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:andesstay_notify}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}

  # ─── JPA: crea la tabla si no existe ─────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.andesstay.notify: DEBUG
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG

