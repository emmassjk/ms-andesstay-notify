spring:
  application:
    name: ms-andesstay-notify-test

  # ─── JWT de prueba: issuer de Cognito ficticio (no se conecta al JWKS real) ──
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_TEST

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual

# ─── AWS Cognito App Client ID para tests ────────────────────────────────────
cognito:
  app-client-id: test-client-id

app:
  cors:
    allowed-origins: http://localhost:3000
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

  rabbit:
    exchange-direct: cmd.direct
    exchange-topic: cmd.topic
    exchange-dlx: cmd.dead.dlx
    email:
      queue: q.cmd.email
      dlq: q.cmd.email.dlq
      routing-key-direct: email.send
      routing-key-topic: email.*
      routing-key-dlq: q.cmd.email.dlq
    housekeeping:
      queue: q.cmd.housekeeping
      dlq: q.cmd.housekeeping.dlq
      routing-key-direct: housekeeping.ticket
      routing-key-topic: "housekeeping.#"
      routing-key-dlq: q.cmd.housekeeping.dlq
    voucher:
      queue: q.cmd.voucher
      dlq: q.cmd.voucher.dlq
      routing-key-direct: voucher.gen
      routing-key-topic: voucher.*
      routing-key-dlq: q.cmd.voucher.dlq
    max-retry-attempts: 3
