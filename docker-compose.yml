# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — ms-andesstay-notify (Docker Desktop)
#
# Levanta el stack completo para ejecución local en Docker Desktop:
#   1. db: PostgreSQL 16 (base de datos con volumen persistente)
#   2. rabbitmq: RabbitMQ 3 con interfaz de gestión (Management UI)
#   3. app: ms-andesstay-notify (Spring Boot 3.3.5 / Java 21)
#
# Comandos principales:
#   docker compose up -d --build       # Construye y levanta todos los servicios
#   docker compose logs -f app         # Monitorear logs de la aplicación
#   docker compose ps                  # Ver estado de los contenedores
#   docker compose down -v             # Detener servicios y eliminar volúmenes
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Base de Datos PostgreSQL 16 ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: andesstay-notify-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-andesstay_notify}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-andesstay_notify}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notify-net

  # ─── Broker RabbitMQ 3 con Management UI ────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: andesstay-notify-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
    ports:
      - "${RABBIT_PORT:-5672}:5672"      # Puerto AMQP (mensajería)
      - "15672:15672"                   # Panel web: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - notify-net

  # ─── Microservicio ms-andesstay-notify (Spring Boot) ─────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andesstay-notify-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      # Profile activo: 'dev' (local sin JWT) o 'prod' (con validación de AWS Cognito)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: 8082

      # ── Conexión a PostgreSQL (servicio 'db' en la red de Docker)
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-andesstay_notify}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}

      # ── Conexión a RabbitMQ (servicio 'rabbitmq' en la red de Docker)
      RABBIT_HOST: rabbitmq
      RABBIT_PORT: 5672
      RABBIT_USER: ${RABBIT_USER:-guest}
      RABBIT_PASS: ${RABBIT_PASS:-guest}
      RABBIT_VHOST: ${RABBIT_VHOST:-/}

      # ── Seguridad AWS Cognito (utilizado cuando SPRING_PROFILES_ACTIVE=prod)
      COGNITO_REGION: ${COGNITO_REGION:-us-east-1}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_APP_CLIENT_ID: ${COGNITO_APP_CLIENT_ID:-}

      # ── CORS (permitir llamadas locales desde Frontend Angular y BFF)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200,http://localhost:8080,http://localhost:8081}

      # ── Tuning JVM para contenedor
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    networks:
      - notify-net

# ─── Volúmenes persistentes ──────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  rabbitmq_data:
    driver: local

# ─── Red interna bridge ──────────────────────────────────────────────────────
networks:
  notify-net:
    driver: bridge
