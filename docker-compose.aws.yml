# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.aws.yml — Despliegue en AWS EC2 (ms-andesstay-notify)
#
# Arquitectura Cloud:
#   - App: Contenedor Docker de Spring Boot (ms-andesstay-notify) en puerto 8082
#   - RabbitMQ: Broker de mensajería (AMQP 5672 + Panel 15672)
#   - Base de Datos: Conexión externa a AWS RDS (PostgreSQL/MySQL)
#
# Uso en la instancia EC2:
#   docker compose -f docker-compose.aws.yml --env-file .env up -d --build
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Broker RabbitMQ (Instalado en EC2) ─────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: andesstay-notify-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS:-guest}
    ports:
      - "5672:5672"            # Puerto AMQP (conexión de productores y consumidores)
      - "15672:15672"          # Panel web de administración
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - notify-net

  # ─── Microservicio ms-andesstay-notify (Spring Boot) ───────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andesstay-notify-app
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8082}:8082"
    environment:
      # Profile activo
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8082}

      # ── Conexión a Base de Datos Cloud (AWS RDS) ──
      DB_URL: ${DB_URL:-jdbc:postgresql://${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-andesstay_notify}}
      DB_HOST: ${DB_HOST:-localhost}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-andesstay_notify}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      # ── Conexión a RabbitMQ ──
      RABBIT_HOST: ${RABBIT_HOST:-rabbitmq}
      RABBIT_PORT: ${RABBIT_PORT:-5672}
      RABBIT_USER: ${RABBIT_USER:-guest}
      RABBIT_PASS: ${RABBIT_PASS:-guest}
      RABBIT_VHOST: ${RABBIT_VHOST:-/}

      # ── Seguridad OAuth2 / JWT (Validación de tokens emitidos por Azure AD / Cognito) ──
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}

      # ── Configuración de CORS (BFF / Frontend) ──
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

      # ── Tuning JVM para optimización de memoria en EC2 ──
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    env_file:
      - .env
    networks:
      - notify-net

# ─── Volúmenes persistentes ──────────────────────────────────────────────────
volumes:
  rabbitmq_data:
    driver: local

# ─── Red interna bridge ──────────────────────────────────────────────────────
networks:
  notify-net:
    driver: bridge
